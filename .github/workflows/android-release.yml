name: Android Release APK Build

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release build description or version notes'
        required: false
        default: 'Manual release build'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Local Environment
        run: |
          if [ ! -f .env ]; then
            echo "Creating empty .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Configure Release Keystore & Secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Release signing secrets found in repository settings."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-signing-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release-signing-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Configured signed release build."
          else
            echo "::warning::Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) not found."
            echo "Generating a temporary fallback keystore for unblocked CI verification."
            echo "NOTE: This build is for internal testing/verification and NOT signed with your production key."
            keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass androidrelease -alias upload -keypass androidrelease \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=aMACEzing Sales Fallback,O=aMACEzing,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=androidrelease" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidrelease" >> $GITHUB_ENV
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      # PRIMARY BUILD STEP: Build Release APK first
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Identify and Log Release APK Output
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Release APK created successfully at: $RELEASE_APK"
            ls -lh "$RELEASE_APK"
            echo "RELEASE_APK_PATH=$RELEASE_APK" >> $GITHUB_ENV
          else
            echo "Error: Release APK was not generated."
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aMACEzing-Sales-release-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Optional Unit Tests: Runs after APK is secured
      - name: Run Unit Tests
        continue-on-error: true
        run: |
          TEST_FILES=$(find app/src/test -type f \( -name "*Test.kt" -o -name "*Test.java" \) 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "No unit tests configured in app/src/test. Skipping unit test execution gracefully."
          else
            echo "Found unit test files. Executing :app:testDebugUnitTest..."
            ./gradlew :app:testDebugUnitTest --no-daemon
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
