
name: Android Build & Test (Debug APK)

on:
  push:
    branches:
      - main
      - master
      - 'WF-**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore
          echo "debug.keystore ready."

      - name: Prepare Local Environment
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "Creating empty .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app
          export FIREBASE_JSON_OUTPUT="$RUNNER_TEMP/google-services.json"

          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            if [ -f app/google-services.json ]; then
              echo "Firebase secret unavailable; validating existing configuration."
              export FIREBASE_JSON_SOURCE=existing
            else
              echo "::error::GOOGLE_SERVICES_JSON is empty or unavailable."
              exit 1
            fi
          else
            export FIREBASE_JSON_SOURCE=secret
          fi

          python3 <<'PY'
          import os
          import json
          import base64
          import binascii
          import sys
          from pathlib import Path

          source = os.environ["FIREBASE_JSON_SOURCE"]
          output = Path(os.environ["FIREBASE_JSON_OUTPUT"])

          if source == "existing":
              try:
                  raw = Path("app/google-services.json").read_text(
                      encoding="utf-8-sig"
                  )
              except (OSError, UnicodeError) as exc:
                  print(f"::error::Cannot read Firebase file: {type(exc).__name__}")
                  sys.exit(1)
              candidates = [("existing file", raw)]
          else:
              raw = os.environ["GOOGLE_SERVICES_JSON"].lstrip("\ufeff")
              candidates = [("raw JSON", raw)]

              try:
                  compact = "".join(raw.split())
                  decoded = base64.b64decode(
                      compact, validate=True
                  ).decode("utf-8-sig")
                  candidates.append(("Base64 JSON", decoded))
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  pass

          errors = []

          for label, candidate in candidates:
              try:
                  data = json.loads(candidate)

                  if not isinstance(data, dict):
                      raise ValueError("JSON root must be an object")

                  if not isinstance(data.get("project_info"), dict):
                      raise ValueError("Missing or invalid project_info")

                  clients = data.get("client")
                  if not isinstance(clients, list) or not clients:
                      raise ValueError("Missing or invalid client array")

                  valid_client = any(
                      isinstance(client, dict)
                      and isinstance(client.get("client_info"), dict)
                      and isinstance(
                          client["client_info"].get("android_client_info"), dict
                      )
                      and client["client_info"]["android_client_info"].get(
                          "package_name"
                      )
                      for client in clients
                  )

                  if not valid_client:
                      raise ValueError("No Android client package name found")

                  output.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8"
                  )

                  print(
                      f"Firebase configuration validated successfully ({label})."
                  )
                  print(f"Validated file size: {output.stat().st_size} bytes.")
                  break

              except json.JSONDecodeError as exc:
                  errors.append(
                      (label, f"JSON parsing failed at line {exc.lineno}, "
                       f"column {exc.colno}")
                  )
              except ValueError as exc:
                  errors.append((label, str(exc)))
          else:
              print("::error::Firebase configuration is invalid.")
              for label, message in errors:
                  print(f"{label}: {message}")
              sys.exit(1)
          PY

          install -m 600 "$FIREBASE_JSON_OUTPUT" app/google-services.json

          python3 -c \
            'import json; json.load(open("app/google-services.json", encoding="utf-8"))'

          echo "Firebase configuration is valid JSON."

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Show Debug SHA-1
        run: ./gradlew :app:signingReport --no-daemon

      - name: Verify Debug APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK_PATH" ]; then
            echo "Debug APK successfully created at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "::error::Debug APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aMACEzing-Sales-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Unit Tests
        id: run_unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          TEST_FILES=$(find app/src/test -type f \( \
            -name "*Test.kt" -o -name "*Test.java" \
          \) 2>/dev/null || true)

          if [ -z "$TEST_FILES" ]; then
            echo "No unit tests found. Skipping unit tests."
          else
            echo "Discovered unit test files:"
            printf '%s\n' "$TEST_FILES"
            ./gradlew :app:testDebugUnitTest --no-daemon
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
